
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE JACKET STAYS ON</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="screen" id="start-screen">
    <h1>THE JACKET STAYS ON</h1>

    <button class="btn" id="start-btn">
      PLAY GAME
    </button>

    <p class="disclaimer">
      PRESS R TO RESTART
    </p>
  </div>

  <div class="screen" id="selection-screen">
    <h1>CHOOSE YOUR FIT</h1>

    <div class="choices">

      <button class="choose-btn" data-mode="jacket">
        <span class="choice-icon">🧥</span>
        <strong>BLACK LEATHER JACKET</strong>
        <small>RIZZ: OVER 9000</small>
      </button>

      <button class="choose-btn" data-mode="no-jacket">
        <span class="choice-icon">👕</span>
        <strong>NO JACKET</strong>
        <small>RIZZ: 0</small>
      </button>

    </div>
  </div>

  <div class="screen game-container" id="game-container">

    <div class="hud">
      <h3 id="time">TIME: 00:00</h3>
      <h3 id="score">RECEIPTS: 0</h3>
    </div>

    <div class="rizz-container">
      <span id="rizz-label">RIZZ LEVEL</span>
      <div class="rizz-bar">
        <div id="rizz-fill"></div>
      </div>
    </div>

    <h2 id="message" class="message"></h2>

    <div id="flash"></div>

    <div id="ending" class="ending hidden">
      <h1 id="ending-title"></h1>
      <p id="ending-text"></p>
      <button class="btn" id="restart-btn">
        PLAY AGAIN
      </button>
    </div>

  </div>

</body>
</html>
